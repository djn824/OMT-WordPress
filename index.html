<title>Camp Fire — Reversed Colors</title>
<style>
  body {

  }
  svg { width: 200px; height: 200px; }
  #swap-btn {
    padding: 10px 24px;

    font-weight: 600;
    color: #fff;
    background: #7DB77E;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #swap-btn:hover { opacity: 0.9; }
  #swap-btn:active { transform: translateY(1px); }

  </svg>

  <button id="swap-btn" type="button">Swap colors</button>

  <script>
    // Swap the two colors used in the SVG: white <-> #7DB77E
    (function () {
      // Map every representation of either color to the other.
      const swap = {
        "#7db77e": "white",
        "white": "#7DB77E",
        "rgb(125, 183, 126)": "white",
        "rgb(255, 255, 255)": "#7DB77E",
      };

      const svg = document.getElementById("campfire");

      function swapColors() {
        svg.querySelectorAll("[fill], [stroke]").forEach((el) => {
          ["fill", "stroke"].forEach((attr) => {
            const value = el.getAttribute(attr);
            if (value == null) return;
            const key = value.trim().toLowerCase();
            if (key in swap) {
              el.setAttribute(attr, swap[key]);
            }
          });
        });
      }

      document.getElementById("swap-btn").addEventListener("click", swapColors);
    })();
  </script>
