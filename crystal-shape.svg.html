<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal Shape SVG</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }
    .wrap {
      width: 220px;
      height: 220px;
      display: grid;
      place-items: center;
      background: #ffffff;
      border-radius: 0;
    }
    svg {
      width: 170px;
      height: 170px;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 170 170" role="img" aria-label="Glowing crystal shape">
      <defs>
        <linearGradient id="gTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff6d5" />
          <stop offset="100%" stop-color="#edc768" />
        </linearGradient>
        <linearGradient id="gTopRight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f7efe1" />
          <stop offset="100%" stop-color="#d9b3db" />
        </linearGradient>
        <linearGradient id="gBottomLeft" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e8b53d" />
          <stop offset="100%" stop-color="#fff0ae" />
        </linearGradient>
        <linearGradient id="gBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e7bfd3" />
          <stop offset="100%" stop-color="#fff2b6" />
        </linearGradient>
        <radialGradient id="baseGlowOuter" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffd964" stop-opacity="0.48" />
          <stop offset="100%" stop-color="#ffd964" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="baseGlowInner" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffde72" stop-opacity="0.95" />
          <stop offset="100%" stop-color="#f3bc42" stop-opacity="0.2" />
        </radialGradient>
        <filter id="glow" x="-250%" y="-250%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="2.2" result="blur1" />
          <feGaussianBlur stdDeviation="4.5" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- subtle outer light like reference -->
      <ellipse cx="85" cy="132" rx="52" ry="16" fill="url(#baseGlowOuter)" />
      <ellipse cx="85" cy="132" rx="22" ry="4.8" fill="url(#baseGlowInner)" />

      <!-- Crystal -->
      <g filter="url(#glow)">
        <!-- Top pyramid -->
        <polygon points="85,30 62,77 85,88.5" fill="url(#gTopLeft)" />
        <polygon points="85,30 108,77 85,88.5" fill="url(#gTopRight)" />

        <!-- Bottom pyramid -->
        <polygon points="85,88.5 62,77 85,130" fill="url(#gBottomLeft)" />
        <polygon points="85,88.5 108,77 85,130" fill="url(#gBottomRight)" />

        <!-- Middle seam highlight -->
        <polyline points="62,77 85,88.5 108,77" fill="none" stroke="#fff5cf" stroke-width="1.15" opacity="0.82" />
        <line x1="85" y1="30" x2="85" y2="130" stroke="#fff2c4" stroke-width="0.95" opacity="0.76" />

        <!-- Edge lines -->
        <polygon points="85,30 62,77 85,130 108,77" fill="none" stroke="#e4b957" stroke-width="1.45" opacity="0.93" />
      </g>
    </svg>
  </div>
</body>
</html>
